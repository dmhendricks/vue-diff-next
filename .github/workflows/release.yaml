name: Release

# 1. Bump `version` in package.json, commit, tag `vX.Y.Z`, push the tag.
#    → This workflow verifies, packs, and opens a *draft* GitHub Release with
#      the tarball. Review it. Delete the tag/release if something's wrong.
#
# 2. Actions → Release → Run workflow → enter the same tag.
#    → Publishes that *existing* tag to npm (OIDC + provenance).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish to npm (e.g. v1.0.0)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Step 1: draft GitHub Release (tag push only) ──────────────────────────
  draft:
    name: Draft GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "Tag must start with v (got: $TAG)"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: package.json version must match tag
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$VERSION" ]; then
            echo "package.json version ($PKG) does not match tag version ($VERSION)"
            exit 1
          fi

      - name: Verify
        run: npm run verify

      - name: Pack
        run: npm pack

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: vue-diff-next-*.tgz
          fail_on_unmatched_files: true

  # ── Step 2: publish to npm (manual only) ──────────────────────────────────
  publish-npm:
    name: Publish to npm
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          case "$TAG" in
            v*) ;;
            *) echo "Tag must start with v (got: $TAG)"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 24 is the first
          # release that bundles a compliant npm. No dependency cache: a
          # poisoned cache can expose the OIDC token to attacker-controlled code.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: package.json version must match tag
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$VERSION" ]; then
            echo "package.json version ($PKG) does not match tag version ($VERSION)"
            exit 1
          fi

      # `prepublishOnly` also runs verify; failing here keeps a red job instead
      # of a half-published version if something slips past prepare.
      - name: Verify
        run: npm run verify

      - name: Publish
        run: npm publish --access public --provenance
        env:
          # No NODE_AUTH_TOKEN: publishing authenticates via OIDC trusted
          # publishing, configured on the npm package.
          NPM_CONFIG_PROVENANCE: true
