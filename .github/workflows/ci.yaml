name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allows re-running the gates without pushing, e.g. to confirm a flake.
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Run each gate as its own step so a failure names itself in the UI
      # rather than hiding inside a composite `npm run verify`.
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The library's central claim is that it ships smaller than the original.
      # An unenforced claim drifts, so this fails the build when it stops holding.
      - name: Size budget
        run: npm run size

      # Catches broken `exports` maps and type declarations that resolve for us
      # locally but not for a consumer under node16 resolution.
      - name: Check packaging
        run: npm run check:exports

  # A matrix job kept separate from the gate job: it re-runs only the parts whose
  # result can vary by Node version, and does not duplicate lint/format/packaging.
  test-matrix:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (see `engines.node`), current LTS, and current.
        node: [20.19.0, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run test

      - run: npm run build
